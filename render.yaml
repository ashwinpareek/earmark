services:
  - type: web
    name: earmark
    runtime: node
    # Free sleeps after 15 idle minutes (cold start ~1 min). For judging week either switch to
    # "starter" or enable .github/workflows/keepalive.yml (set the APP_URL repo variable).
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PROVIDER_PAYPAL_EMAIL
        sync: false
      - key: PHARMACY_PAYPAL_EMAIL
        sync: false
      - key: PAYEE_MODE
        value: payout
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE
        sync: false
