# Render Blueprint: New → Blueprint → pick this repo. Everything here is on Render's free plan:
#   earmark       the web app (Next.js): pages, PayPal webhooks, the Forgery Lab
#   earmark-db    Postgres: every campaign, ledger entry and uploaded document survives restarts
# The daily hold renewal (renew PayPal holds after their 3-day honor period, mark expired ones)
# runs from .github/workflows/holds.yml, because Render has no free plan for cron jobs.
#
# Free web services sleep after 15 idle minutes (about a minute to wake). For judging, use the
# starter plan (the hackathon's Render credits cover it) or the GitHub keepalive workflow.
# Note: a free Render Postgres expires after 30 days, so use a paid plan for anything that
# must outlive that (again, the hackathon credits cover it).
databases:
  - name: earmark-db
    plan: free
    databaseName: earmark
    user: earmark

services:
  - type: web
    name: earmark
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: earmark-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PROVIDER_PAYPAL_EMAIL
        sync: false
      - key: PAYEE_MODE
        value: payout
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
# Optional, add in the dashboard: PAYPAL_WEBHOOK_ID (signed webhooks), PHARMACY_PAYPAL_EMAIL,
# AG_STUDIO_LICENSE (removes the ledger watermark), ANTHROPIC_API_KEY or OPENAI_API_KEY.
