# Render Blueprint: New → Blueprint → pick this repo. Three services:
#   earmark       the web app (Next.js): pages, PayPal webhooks, the Forgery Lab
#   earmark-db    Postgres: every campaign, ledger entry and uploaded document survives restarts
#   earmark-holds a daily cron job that renews PayPal holds after their 3-day honor period
#                 and marks holds that expired, so pledges never silently stop being collectable
#
# Free web services sleep after 15 idle minutes (about a minute to wake). For judging, use the
# starter plan (the hackathon's Render credits cover it) or the GitHub keepalive workflow.
# Note: a free Render Postgres expires after 30 days, so use a paid plan for anything that
# must outlive that (again, the hackathon credits cover it).
databases:
  - name: earmark-db
    plan: free
    databaseName: earmark
    user: earmark

services:
  - type: web
    name: earmark
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: earmark-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PROVIDER_PAYPAL_EMAIL
        sync: false
      - key: PHARMACY_PAYPAL_EMAIL
        sync: false
      - key: PAYEE_MODE
        value: payout
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE
        sync: false

  - type: cron
    name: earmark-holds
    runtime: node
    plan: starter
    schedule: "17 6 * * *"
    buildCommand: "true"
    startCommand: node scripts/cron-holds.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_HOST
        fromService:
          type: web
          name: earmark
          property: host
      - key: CRON_SECRET
        fromService:
          type: web
          name: earmark
          envVarKey: CRON_SECRET
