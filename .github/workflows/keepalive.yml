# Keeps the free Render instance awake during judging, so a judge never waits ~1 minute
# for a cold start. Set the repository variable APP_URL (Settings → Secrets and variables →
# Actions → Variables) to your Render URL, e.g. https://earmark.onrender.com
# GitHub may delay scheduled runs by a few minutes; that's fine (Render sleeps after 15 idle).
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.APP_URL }}/api/status" || curl -fsS --max-time 90 "${{ vars.APP_URL }}/api/status"
